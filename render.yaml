services:
  - type: web
    name: ai-provenance-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-provenance-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: local
      - key: KEEP_ALIVE_URL
        value: "" # Set to your deployed Render URL (e.g. https://ai-provenance-backend.onrender.com/healthz) to prevent sleeping

databases:
  - name: ai-provenance-db
    plan: free
    databaseName: provenance
    user: provenance
